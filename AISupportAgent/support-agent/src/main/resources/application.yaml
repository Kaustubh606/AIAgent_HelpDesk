
spring:
  application:
    name: support-agent

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

    mcp:
      client:
        streamable-http:
          connections:
            support-agent:
              url: http://localhost:8090
              endpoint: /mcp

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

support-agent:
  inbox:
    # Mailpit REST API - Agent monitors this inbox
    base-url: http://localhost:8025

    # Recipient address used for seeding test emails
    address: support@example.com

    # Poll inbox every 10 seconds
    poll-interval: 10000

    # Maximum unread messages per poll
    batch-size: 50
